<style>
:root{
  --bg:#ffffff; --surface:#f4f5f7; --surface2:#e9ebef; --ink:#0b0b0c; --ink2:#3a3e46; --muted:#6a7079; --line:#e3e5ea;

  --font:'Inter Tight','Noto Sans JP','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --surface:#17181b; --surface2:#23252a; --ink:#f5f6f8; --ink2:#c9ccd3; --muted:#8b919b; --line:#26282d;
    --a:#6f8dff; --a-text:#6f8dff; --a-big:#6f8dff; --b:#ffe14d; --b-text:#ffe14d; --on-a:#0b0b0c; --on-b:#0b0b0c;
    --warn:#ffcc80; --warn-bg:#2e2412; --ok:#7bdc9a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#17181b; --surface2:#23252a; --ink:#f5f6f8; --ink2:#c9ccd3; --muted:#8b919b; --line:#26282d;
  --a:#6f8dff; --a-text:#6f8dff; --a-big:#6f8dff; --b:#ffe14d; --b-text:#ffe14d; --on-a:#0b0b0c; --on-b:#0b0b0c;
  --warn:#ffcc80; --warn-bg:#2e2412; --ok:#7bdc9a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 64px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{position:relative;width:18px;height:18px;border-radius:6px;background:var(--ink);display:inline-block;box-shadow:3px 3px 0 var(--acid)}
.wordmark{font-weight:800;font-size:21px;letter-spacing:.01em}
.tag{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:6px 11px;border-radius:99px;color:var(--muted)}
.langsw{display:flex;background:var(--surface);border-radius:99px;padding:3px;gap:2px}
.lbtn{border:0;background:transparent;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.lbtn.on{background:var(--ink);color:var(--bg)}
.subrow{display:flex;justify-content:flex-end;margin-top:8px}

/* hero */
.hero{padding:22px 0 8px;text-align:center}
.comp{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.teams{display:grid;grid-template-columns:1fr 1fr;margin-top:18px}
.tm{display:flex;flex-direction:column;align-items:center;gap:8px}
.crest{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:14px}
.crest.a{background:var(--a);color:var(--on-a)} .crest.b{background:var(--b);color:var(--on-b)}
.tname{font-weight:700;font-size:16px}
.tpos{margin-top:1px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--muted)}
.tpos.up{color:var(--ok)} .tpos.down{color:var(--warn)}
.score{display:flex;justify-content:center;align-items:baseline;gap:14px;margin-top:2px;font-weight:800;font-size:clamp(84px,24vw,128px);line-height:1;letter-spacing:-.05em}
.score .sep{color:var(--surface2);font-weight:600;letter-spacing:0}
.score .sa{color:var(--a-big)} .score .sb{color:var(--b-text)}
.status{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 1px var(--ink) inset}
.scorers{display:flex;justify-content:center;gap:46px;margin-top:18px;flex-wrap:wrap}
.scol{display:flex;flex-direction:column;gap:4px;min-width:120px}
.scol.a{align-items:flex-end;text-align:right} .scol.b{align-items:flex-start;text-align:left}
.sline{font-size:13.5px;color:var(--ink2)}
.sline b{font-weight:700;color:var(--ink)}
.ribbon{margin:20px auto 0;max-width:520px}
.rib-labels{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:8px}
.rib-labels .a{color:var(--a-text)} .rib-labels .b{color:var(--b-text)}
.rib-labels span.mid{color:var(--muted);font-weight:500;font-size:13px}
.rib{display:flex;gap:4px;height:12px}
.rib i{display:block;border-radius:99px;flex:1 1 0%;transition:flex-grow .9s cubic-bezier(.2,.8,.2,1)}
.rib .ra{background:var(--a)} .rib .rb{background:var(--b)}

/* insight */
.insight{background:var(--acid);color:#0b0b0c;margin:28px -18px 0;padding:18px;display:flex;gap:12px;align-items:flex-start}
.insight i{width:7px;height:7px;border-radius:50%;background:#0b0b0c;margin-top:9px;flex:none}
.insight p{margin:0;font-weight:700;font-size:16.5px;line-height:1.4;letter-spacing:-.01em}

/* story */
.story{margin-top:34px}
.story h2{margin:0 0 14px;font-size:clamp(24px,6.6vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.03em}
.story p{margin:0 0 12px;font-size:16.5px;line-height:1.55;color:var(--ink2);max-width:62ch}
.tc{font-weight:700}
.tc.a{color:var(--a-text)} .tc.b{color:var(--b-text)}

/* mini cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:34px}
.mini{background:var(--surface);border-radius:20px;padding:15px 15px 14px}
.mlab{font-size:14px;color:var(--muted);font-weight:500}
.mvals{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:30px;font-weight:800;letter-spacing:-.03em}
.mvals .a{color:var(--a-text)} .mvals .b{color:var(--b-text)}
.mcap{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.3}

/* sections */
.sec{margin-top:44px}
.sec h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sec .sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.panel{background:var(--surface);border-radius:26px;padding:20px 18px}
.swap{animation:swap .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

/* explorer */
.legend{display:flex;gap:16px;margin-top:14px;font-size:14px;font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:6px;overflow-x:auto;margin:16px -2px 4px;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .2s}
.chip.on{background:var(--acid);border-color:transparent;color:var(--acid-ink)}
.row{padding:14px 0;border-top:1px solid var(--line);cursor:pointer;outline-offset:-2px}
.row:first-of-type{border-top:0}
.rtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline}
.rv{font-size:22px;font-weight:800;letter-spacing:-.02em}
.rv.a{color:var(--a-text);text-align:left} .rv.b{color:var(--b-text);text-align:right}
.rl{font-size:14px;color:var(--ink2);font-weight:500;text-align:center;padding:0 8px}
.bar{display:flex;gap:4px;height:8px;margin-top:9px}
.bar i{display:block;flex:1 1 0%;border-radius:99px;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.bar .ba{background:var(--a)} .bar .bb{background:var(--b)}
.bar.zero i{background:var(--surface2)}
.rdetail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.rdetail>div{overflow:hidden;font-size:14px;color:var(--muted);line-height:1.45}
.row.open .rdetail{grid-template-rows:1fr}
.row.open .rdetail>div{padding-top:10px}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:44px}
.btn{border:0;border-radius:99px;padding:15px 22px;font-weight:800;font-size:16px;background:var(--acid);color:var(--acid-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
#ta{display:block;width:100%;margin-top:12px;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;font:13px var(--mono)}
#ta[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14.5px;pointer-events:none;transition:all .3s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.footer{margin:60px -18px -64px;padding:26px 18px;background:#10131a;color:rgba(255,255,255,.55);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.footer .wordmark{color:#fff;font-size:16px}
.footer .mark{background:#fff;box-shadow:none}
.footer .fine{font:500 10.5px var(--mono);letter-spacing:.03em;text-transform:uppercase}

@media (max-width:380px){.scorers{gap:22px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

function nm(t,team){return TEAM[team][lang];}

function runCounters(root){
  root.querySelectorAll('[data-to]').forEach(function(el){
    var to = +el.dataset.to, dec = +(el.dataset.dec||0), suf = el.dataset.suf||'';
    if(reduce){el.textContent = to.toFixed(dec)+suf; return;}
    var t0 = performance.now(), dur = 800;
    function step(t){
      var p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = (to*e).toFixed(dec)+suf;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function applyBars(root){
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    root.querySelectorAll('[data-f]').forEach(function(e){e.style.flexGrow = e.dataset.f;});
  });});
}
function swap(el){el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');}

/* ---------- render ---------- */
function renderHero(){
  var S = STR[lang];
  $('#htmlRoot').lang = lang;
  $('#tag').textContent = S.tag;
  $('#comp').textContent = S.comp;
  $('#tnameA').textContent = TEAM.A[lang];
  $('#tnameB').textContent = TEAM.B[lang];
  $('#tposA').textContent = S.posA+' \u2193';
  $('#tposB').textContent = S.posB+' \u2191';
  $('#scA').dataset.to = SCORE.A;
  $('#scB').dataset.to = SCORE.B;
  $('#status').innerHTML = '<i class="dot"></i>'+S.status;

  var ga = GOALS.A.map(function(g){return '<span class="sline"><b>'+g[1]+'</b> '+g[0]+'</span>';}).join('');
  var gb = GOALS.B.map(function(g){return '<span class="sline"><b>'+g[1]+'</b> '+g[0]+'</span>';}).join('');
  if(RED.team==='A') ga += '<span class="sline" style="color:var(--warn)">'+RED.min+' '+RED.player+' \u2014 '+S.redLine+'</span>';
  if(RED.team==='B') gb += '<span class="sline" style="color:var(--warn)">'+RED.min+' '+RED.player+' \u2014 '+S.redLine+'</span>';
  $('#scorersA').innerHTML = ga;
  $('#scorersB').innerHTML = gb;

  $('#ribMid').textContent = S.ribMid;
  $('#ribA').textContent = '40%';
  $('#ribB').textContent = '60%';

  runCounters($('#hero'));
  applyBars($('.ribbon'));
}

function renderInsight(){
  $('#insightText').textContent = STR[lang].insight;
}

function renderStory(){
  var S = STR[lang];
  var el = $('#story');
  el.innerHTML = '<h2>'+S.storyH+'</h2><p>'+S.storyP1+'</p><p>'+S.storyP2+'</p>';
  swap(el);
}

function renderCards(){
  var S = STR[lang];
  var cards = [
    {lab:S.c1lab, cap:S.c1cap, a:5, b:19, suf:''},
    {lab:S.c2lab, cap:S.c2cap, a:4, b:12, suf:''},
    {lab:S.c3lab, cap:S.c3cap, a:40, b:60, suf:'%'},
    {lab:S.c4lab, cap:S.c4cap, a:1, b:8, suf:''}
  ];
  var h = cards.map(function(c){
    return '<div class="mini"><div class="mlab">'+c.lab+'</div>'+
      '<div class="mvals"><span class="a num" data-to="'+c.a+'" data-suf="'+c.suf+'">0</span>'+
      '<span class="b num" data-to="'+c.b+'" data-suf="'+c.suf+'">0</span></div>'+
      '<div class="mcap">'+c.cap+'</div></div>';
  }).join('');
  var g = $('#cards'); g.innerHTML = h; runCounters(g);
}

function renderExplorer(){
  var S = STR[lang];
  $('#expH').textContent = S.expH;
  $('#expSub').textContent = S.expSub;
  $('#legend').innerHTML = '<span><i style="background:var(--a)"></i>'+TEAM.A[lang]+'</span><span><i style="background:var(--b)"></i>'+TEAM.B[lang]+'</span>';

  var groups = ['all','attack','passing','defence','discipline'];
  $('#gchips').innerHTML = groups.map(function(g){
    return '<button class="chip'+(g===group?' on':'')+'" data-grp="'+g+'">'+GLAB[lang][g]+'</button>';
  }).join('');

  var list = M.filter(function(m){return group==='all' || m.g===group;});
  var h = list.map(function(m){
    var L = m[lang];
    var av = m.aTxt!=null ? m.aTxt : (m.a+(m.suf||''));
    var bv = m.bTxt!=null ? m.bTxt : (m.b+(m.suf||''));
    var fa = m.af!=null ? m.af : m.a, fb = m.bf!=null ? m.bf : m.b;
    var zero = (fa+fb)===0;
    return '<div class="row" tabindex="0" role="button" aria-expanded="false">'+
      '<div class="rtop"><span class="rv a">'+av+'</span><span class="rl">'+L.l+'</span><span class="rv b">'+bv+'</span></div>'+
      '<div class="bar'+(zero?' zero':'')+'"><i class="ba" data-f="'+(zero?1:fa)+'"></i><i class="bb" data-f="'+(zero?1:fb)+'"></i></div>'+
      '<div class="rdetail"><div>'+L.h+'</div></div>'+
      '</div>';
  }).join('');
  var rows = $('#rows'); rows.innerHTML = h; swap(rows); applyBars(rows);
}

function renderActions(){
  var S = STR[lang];
  $('#copyS').textContent = S.copyS;
  $('#copyJ').textContent = S.copyJ;
  $('#footFine').textContent = S.footFine;
}

function renderAll(){
  renderHero(); renderInsight(); renderStory(); renderCards(); renderExplorer(); renderActions();
  document.querySelectorAll('.langsw .lbtn').forEach(function(b){
    b.classList.toggle('on', b.dataset.lang===lang);
  });
}

/* ---------- export ---------- */
function summaryText(){
  var S = STR[lang];
  var t = TEAM.A[lang]+' '+SCORE.A+'-'+SCORE.B+' '+TEAM.B[lang]+' | '+S.comp+'\n\n';
  M.forEach(function(m){
    var L = m[lang];
    var av = m.aTxt!=null ? m.aTxt : (m.a+(m.suf||''));
    var bv = m.bTxt!=null ? m.bTxt : (m.b+(m.suf||''));
    t += L.l+': '+av+' - '+bv+'\n';
  });
  return t+'\nVantage';
}
function jsonText(){
  var o = {match:TEAM.A.en+' vs '+TEAM.B.en, match_ja:TEAM.A.ja+' vs '+TEAM.B.ja, competition:'J1 League', score:SCORE, stats:{}};
  M.forEach(function(m){
    o.stats[m.k] = {label_en:m.en.l, label_ja:m.ja.l, a: m.aTxt!=null?m.aTxt:m.a, b: m.bTxt!=null?m.bTxt:m.b};
  });
  return JSON.stringify(o,null,2);
}
var tt;
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(function(){el.classList.remove('show');},1900);
}
function copyText(text,msg){
  var ta = $('#ta');
  function fallback(){
    try{
      ta.hidden = false; ta.value = text; ta.select(); ta.setSelectionRange(0,text.length);
      if(document.execCommand('copy')){ ta.hidden = true; toast(msg); return; }
    }catch(e){}
    ta.hidden = false; ta.value = text; ta.select();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(msg);}).catch(fallback);
  } else { fallback(); }
}

/* counters with custom suffix (mini cards use data-suf) */
var _origRunCounters = runCounters;
runCounters = function(root){
  root.querySelectorAll('[data-to]').forEach(function(el){
    var to = +el.dataset.to, dec = +(el.dataset.dec||0), suf = el.dataset.suf||'';
    if(reduce){el.textContent = to.toFixed(dec)+suf; return;}
    var t0 = performance.now(), dur = 800;
    function step(t){
      var p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = (to*e).toFixed(dec)+suf;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
};

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t = e.target;
  var lb = t.closest('[data-lang]'); if(lb){ if(lb.dataset.lang!==lang){ lang = lb.dataset.lang; renderAll(); } return; }
  var bg = t.closest('[data-grp]'); if(bg){ group = bg.dataset.grp; renderExplorer(); return; }
  var row = t.closest('.row');
  if(row){
    var was = row.classList.contains('open');
    document.querySelectorAll('.row.open').forEach(function(r){r.classList.remove('open');r.setAttribute('aria-expanded','false');});
    if(!was){row.classList.add('open');row.setAttribute('aria-expanded','true');}
    return;
  }
  if(t.closest('#copyS')){copyText(summaryText(),STR[lang].toastS); return;}
  if(t.closest('#copyJ')){copyText(jsonText(),STR[lang].toastJ); return;}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('row')){
    e.preventDefault(); e.target.click();
  }
});

renderAll();
})();
</script>
