name: Update predictions
on:
  schedule:
    - cron: "0 7 * * *"          # daily refresh
    - cron: "*/10 11-22 * * *"   # every 10 min, 11:00-22:59 UTC, for live scores
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-predictions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run updater
        run: python3 scripts/update_predictions.py
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions.json
          git diff --staged --quiet || (git pull --rebase && git commit -m "Update predictions" && git push)

