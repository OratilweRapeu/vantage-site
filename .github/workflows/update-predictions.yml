name: Update win probabilities

on:
  schedule:
    - cron: "0 6 * * *"            # every morning
    - cron: "0 12-22/2 * * 5,6,0,1" # every 2 hours Fri to Mon, so results appear soon after full time
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build predictions
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/update_predictions.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- predictions.json; then echo "No change"; exit 0; fi
          git config user.name "vantage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions.json
          git commit -m "Update win probabilities"
          git push
