name: Update predictions

on:
  workflow_dispatch:          # gives you the "Run workflow" button
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours (UTC)

permissions:
  contents: write             # lets the job commit predictions.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run updater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 scripts/update_predictions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json
          git diff --staged --quiet || (git commit -m "Update predictions" && git push)

